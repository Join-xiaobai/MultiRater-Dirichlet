# Hyperparameter Configuration for MultiRater-Dirichlet
experiment:
  name: "MultiRater-Dirichlet-LIDC"
  seed: 42
  device: "cuda"

data:
  cohort_size: 1010
  split_ratio: [0.70, 0.10, 0.20] # Train / Cal / Test (Patient-Disjoint)
  test_nodules: 507
  multi_reader_test_nodules: 360
  target_volume_shape: [32, 32, 32]
  num_morphological_priors: 17

model:
  feature_dim: 128
  num_classes: 5
  hidden_dim: 64
  backbone: "Backbone3D"

training:
  epochs: 80
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  loss:
    lambda_digamma: 1.0
    lambda_variance: 0.5
    lambda_kl: 0.005

evaluation:
  bootstrap_draws: 1000
  dca_thresholds: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]
  deferral_ratio: 0.20
